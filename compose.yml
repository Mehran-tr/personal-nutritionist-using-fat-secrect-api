x-hardened: &hardened
  read_only: true                 # immutable container filesystem
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]               # the app needs no Linux capabilities

services:
  api:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE__URL: postgresql+asyncpg://nutritionist:nutritionist@postgres:5432/nutritionist
      CACHE__REDIS_URL: redis://redis:6379/0
    # Local development only. In deployment, only the TLS proxy is published.
    # A port range so `docker compose up --scale api=3` works (8000, 8001, ...).
    ports:
      - "127.0.0.1:8000-8009:8000"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Runs once before the API starts. Migrations are never run by the app itself,
  # so several API replicas can never race on a schema change.
  migrate:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE__URL: postgresql+asyncpg://nutritionist:nutritionist@postgres:5432/nutritionist
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    # Slow-query log + pg_stat_statements for profiling (see PERFORMANCE.md).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=250
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: nutritionist
      POSTGRES_PASSWORD: nutritionist
      POSTGRES_DB: nutritionist
    ports:
      - "127.0.0.1:5432:5432"   # never expose the database beyond localhost
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutritionist"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # HTTPS termination (TLS 1.2+/1.3 with modern ciphers, automatic certificates).
  # Start with: DOMAIN=api.example.com docker compose --profile tls up
  proxy:
    profiles: ["tls"]
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

  # Metrics: `docker compose --profile observability up` -> Prometheus on :9090,
  # Grafana on :3000 (add Prometheus at http://prometheus:9090 as data source).
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.0.0
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

volumes:
  pgdata:
  caddy_data:
