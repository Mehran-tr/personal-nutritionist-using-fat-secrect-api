[project]
name = "nutritionist"
version = "0.1.0"
description = "Your personal nutritionist — FastAPI backend powered by the fatsecret Platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "redis>=5.2",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutritionist"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "PT", "C4", "RET", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --cov=nutritionist --cov-report=term-missing:skip-covered"
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
branch = true

# ---------------------------------------------------------------- architecture rules
# Run with `uv run lint-imports`. These fail CI if a boundary leaks.
[tool.importlinter]
root_package = "nutritionist"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Every module: api|infrastructure -> application -> domain"
type = "layers"
containers = [
    "nutritionist.modules.catalog",
    "nutritionist.modules.identity",
    "nutritionist.modules.profile",
]
layers = ["api | infrastructure", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Targets (pure computation, no infrastructure): api -> application -> domain"
type = "layers"
containers = ["nutritionist.modules.targets"]
layers = ["api", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Modules are independent (they share only nutritionist.core)"
type = "independence"
modules = [
    "nutritionist.modules.catalog",
    "nutritionist.modules.identity",
    "nutritionist.modules.profile",
    "nutritionist.modules.targets",
]

[[tool.importlinter.contracts]]
name = "Domain and application layers are framework-free"
type = "forbidden"
source_modules = [
    "nutritionist.modules.*.domain",
    "nutritionist.modules.*.application",
]
forbidden_modules = [
    "fastapi", "starlette", "httpx", "redis", "structlog", "sqlalchemy", "jwt", "argon2",
    "nutritionist.integrations", "nutritionist.api", "nutritionist.core.db",
]

[[tool.importlinter.contracts]]
name = "Cross-module adapters (interop) are used only by the composition root"
type = "forbidden"
source_modules = ["nutritionist.modules", "nutritionist.core", "nutritionist.api"]
forbidden_modules = ["nutritionist.interop"]

[[tool.importlinter.contracts]]
name = "Interop talks to modules only through their application/domain layers"
type = "forbidden"
source_modules = ["nutritionist.interop"]
forbidden_modules = [
    "nutritionist.modules.catalog.infrastructure",
    "nutritionist.modules.identity.infrastructure",
    "nutritionist.modules.profile.infrastructure",
    "nutritionist.modules.catalog.api",
    "nutritionist.modules.identity.api",
    "nutritionist.modules.profile.api",
    "nutritionist.modules.targets.api",
]

[[tool.importlinter.contracts]]
name = "Integrations do not depend on the web layer"
type = "forbidden"
source_modules = ["nutritionist.integrations"]
forbidden_modules = ["fastapi", "starlette", "nutritionist.api"]

[[tool.importlinter.contracts]]
name = "Core is a leaf: it never imports feature modules"
type = "forbidden"
source_modules = ["nutritionist.core"]
forbidden_modules = ["nutritionist.modules", "nutritionist.integrations", "nutritionist.bootstrap"]
